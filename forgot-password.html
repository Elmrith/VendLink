<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="csrf-token" content="">
  <title>Forgot Password - VendLink</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="registration-page">
  <header class="registration-nav">
    <a href="index.html" class="landing-brand" aria-label="VendLink home"><span class="landing-brand-mark">V</span><span>Vend<span>Link</span></span></a>
    <a class="registration-home-link" href="index.html#access">Back to sign in</a>
  </header>
  <main class="registration-main">
    <section class="registration-intro">
      <span class="landing-eyebrow"><span></span> Account recovery</span>
      <h1>Reset your password.</h1>
      <p>Enter your registered email. If it belongs to a VendLink account, a one-time reset link will be sent.</p>
    </section>
    <section class="registration-panel" aria-labelledby="recoveryHeading">
      <div class="registration-panel-heading"><div><span class="registration-step">SECURE RECOVERY</span><h2 id="recoveryHeading">Request a reset link</h2></div></div>
      <div id="passwordResetNotice" class="registration-notice" role="status" aria-live="polite" hidden></div>
      <form id="forgotPasswordForm" class="registration-form">
        <label for="recoveryEmail">Email address<input id="recoveryEmail" type="email" autocomplete="email" maxlength="191" required placeholder="you@business.com"></label>
        <button id="requestResetButton" class="registration-submit" type="submit">Send reset link</button>
      </form>
    </section>
  </main>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/password-reset.js"></script>
</body>
</html>
