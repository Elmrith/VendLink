<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <meta name="csrf-token" content="">
  <title>Set a New Password - VendLink</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="registration-page">
  <header class="registration-nav">
    <a href="index.html" class="landing-brand" aria-label="VendLink home"><span class="landing-brand-mark">V</span><span>Vend<span>Link</span></span></a>
    <a class="registration-home-link" href="index.html#access">Back to sign in</a>
  </header>
  <main class="registration-main">
    <section class="registration-intro">
      <span class="landing-eyebrow"><span></span> Account recovery</span>
      <h1>Choose a new password.</h1>
      <p>Reset links expire after 30 minutes and can only be used once.</p>
    </section>
    <section class="registration-panel" aria-labelledby="newPasswordHeading">
      <div class="registration-panel-heading"><div><span class="registration-step">SECURE RECOVERY</span><h2 id="newPasswordHeading">Set a new password</h2></div></div>
      <div id="passwordResetNotice" class="registration-notice" role="status" aria-live="polite" hidden></div>
      <form id="resetPasswordForm" class="registration-form">
        <label for="newPassword">New password<input id="newPassword" type="password" autocomplete="new-password" minlength="8" maxlength="72" required></label>
        <label for="confirmPassword">Confirm password<input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" maxlength="72" required></label>
        <button id="saveNewPasswordButton" class="registration-submit" type="submit">Change password</button>
      </form>
    </section>
  </main>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/password-visibility.js"></script>
  <script src="assets/js/password-reset.js"></script>
</body>
</html>
