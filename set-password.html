<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="csrf-token" content="">
  <meta name="referrer" content="no-referrer">
  <title>Set supplier password - VendLink</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="assets/js/lucide.min.js"></script>
</head>
<body class="registration-page">
  <header class="registration-nav">
    <a href="index.html" class="landing-brand" aria-label="VendLink home"><span class="landing-brand-mark"><i data-lucide="boxes" class="w-5 h-5"></i></span><span>Vend<span>Link</span></span></a>
    <a class="registration-signin" href="index.html#access"><i data-lucide="arrow-left" class="h-4 w-4"></i> Sign in</a>
  </header>

  <main class="registration-main registration-main--compact">
    <section class="registration-panel" aria-labelledby="setupHeading">
      <div class="registration-panel-heading">
        <div><span class="registration-step">APPROVED SUPPLIER</span><h1 id="setupHeading">Set your password</h1></div>
        <span class="registration-lock"><i data-lucide="shield-check" class="h-4 w-4"></i> Secure setup</span>
      </div>
      <p class="registration-description">Choose a password of at least 12 characters to finish setting up your account. This link expires after 30 minutes.</p>
      <div id="setupNotice" class="registration-notice" role="status" aria-live="polite" hidden></div>
      <form id="setupForm" class="registration-form">
        <label for="setupPassword">New password<input id="setupPassword" type="password" autocomplete="new-password" minlength="12" required placeholder="At least 12 characters"></label>
        <label for="setupPasswordConfirm">Confirm password<input id="setupPasswordConfirm" type="password" autocomplete="new-password" minlength="12" required placeholder="Enter the same password again"></label>
        <button id="setupSubmit" class="registration-submit" type="submit">Save password <i data-lucide="arrow-right" class="h-4 w-4"></i></button>
      </form>
    </section>
  </main>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/password-visibility.js"></script>
  <script src="assets/js/supplier-setup.js"></script>
</body>
</html>
