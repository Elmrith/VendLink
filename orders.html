<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders - VendLink</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="assets/js/lucide.min.js"></script>
</head>
<body class="role-vendor min-h-screen bg-slate-50 text-slate-900 font-sans antialiased">
  <div data-site-header></div>

  <main class="page-shell max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">
    
    <!-- Page Header -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
      <div>
        <h1 class="text-2xl font-black text-slate-900 tracking-tight flex items-center gap-2.5">
          <div class="w-9 h-9 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center shadow-sm">
            <i data-lucide="shopping-bag" class="w-5 h-5"></i>
          </div>
          My Orders
        </h1>
        <p class="text-sm text-slate-500 mt-1">Track wholesale delivery progress, inspect line item receipts, and repeat frequent orders.</p>
      </div>

      <div class="flex items-center gap-2">
        <a href="marketplace.html" class="px-3.5 py-2 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold shadow-md shadow-blue-500/20 transition flex items-center gap-1.5">
          <i data-lucide="store" class="w-4 h-4"></i> Browse Supplies
        </a>
      </div>
    </div>

    <!-- Filters & Search Toolbar -->
    <div class="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm space-y-4">
      <div class="flex flex-col lg:flex-row items-stretch lg:items-center justify-between gap-3">
        <!-- Live Search Input -->
        <div class="relative flex-1 min-w-48">
          <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3.5 top-3"></i>
          <input type="text" id="orderSearchInput" placeholder="Search receipt, supplier name/username, or product..."
            class="w-full pl-10 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:bg-white focus:ring-2 focus:ring-blue-600/20 focus:border-blue-600 transition">
        </div>

        <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
          <select id="orderYearFilter" aria-label="Filter orders by year" class="px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold text-slate-700">
            <option value="">All years</option>
          </select>
          <select id="orderMonthFilter" aria-label="Filter orders by month" class="px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold text-slate-700">
            <option value="">All months</option>
            <option value="1">January</option><option value="2">February</option><option value="3">March</option>
            <option value="4">April</option><option value="5">May</option><option value="6">June</option>
            <option value="7">July</option><option value="8">August</option><option value="9">September</option>
            <option value="10">October</option><option value="11">November</option><option value="12">December</option>
          </select>
          <select id="orderDayFilter" aria-label="Filter orders by day" class="px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold text-slate-700">
            <option value="">All days</option>
            <option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option>
            <option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option>
            <option value="9">9</option><option value="10">10</option><option value="11">11</option><option value="12">12</option>
            <option value="13">13</option><option value="14">14</option><option value="15">15</option><option value="16">16</option>
            <option value="17">17</option><option value="18">18</option><option value="19">19</option><option value="20">20</option>
            <option value="21">21</option><option value="22">22</option><option value="23">23</option><option value="24">24</option>
            <option value="25">25</option><option value="26">26</option><option value="27">27</option><option value="28">28</option>
            <option value="29">29</option><option value="30">30</option><option value="31">31</option>
          </select>
          <select id="orderSortSelect" aria-label="Sort orders" class="px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold text-slate-700">
            <option value="date-desc">Newest first</option>
            <option value="date-asc">Oldest first</option>
            <option value="supplier-name-asc">Supplier name A–Z</option>
            <option value="supplier-name-desc">Supplier name Z–A</option>
            <option value="supplier-username-asc">Supplier username A–Z</option>
            <option value="supplier-username-desc">Supplier username Z–A</option>
          </select>
        </div>

        <button type="button" onclick="loadOrders()" class="text-xs font-bold text-slate-500 hover:text-blue-600 flex items-center gap-1.5 transition self-end lg:self-center">
          <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i> Refresh Orders
        </button>
      </div>

      <!-- Status Filter Tabs -->
      <div class="flex items-center gap-2 overflow-x-auto pb-1" id="orderStatusTabs">
        <button type="button" onclick="setFilter('all')" class="order-tab-btn order-tab-btn--active" data-status="all">
          <span>All Orders</span>
          <span class="order-tab-count" id="countAll">0</span>
        </button>
        <button type="button" onclick="setFilter('pending')" class="order-tab-btn" data-status="pending">
          <i data-lucide="clock" class="w-3 h-3 text-amber-500"></i>
          <span>Pending</span>
          <span class="order-tab-count" id="countPending">0</span>
        </button>
        <button type="button" onclick="setFilter('confirmed')" class="order-tab-btn" data-status="confirmed">
          <i data-lucide="truck" class="w-3 h-3 text-blue-500"></i>
          <span>Confirmed</span>
          <span class="order-tab-count" id="countConfirmed">0</span>
        </button>
        <button type="button" onclick="setFilter('processing')" class="order-tab-btn" data-status="processing">
          <i data-lucide="loader-circle" class="w-3 h-3 text-violet-500"></i>
          <span>Processing</span>
          <span class="order-tab-count" id="countProcessing">0</span>
        </button>
        <button type="button" onclick="setFilter('ready_for_dispatch')" class="order-tab-btn" data-status="ready_for_dispatch">
          <i data-lucide="package-check" class="w-3 h-3 text-cyan-500"></i>
          <span>Ready for Dispatch</span>
          <span class="order-tab-count" id="countReadyForDispatch">0</span>
        </button>
        <button type="button" onclick="setFilter('shipped')" class="order-tab-btn" data-status="shipped">
          <i data-lucide="truck" class="w-3 h-3 text-indigo-500"></i>
          <span>Shipped</span>
          <span class="order-tab-count" id="countShipped">0</span>
        </button>
        <button type="button" onclick="setFilter('delivered')" class="order-tab-btn" data-status="delivered">
          <i data-lucide="truck" class="w-3 h-3 text-emerald-500"></i>
          <span>Delivered</span>
          <span class="order-tab-count" id="countDelivered">0</span>
        </button>
        <button type="button" onclick="setFilter('arrival_confirmed')" class="order-tab-btn" data-status="arrival_confirmed">
          <i data-lucide="check-circle" class="w-3 h-3 text-emerald-500"></i>
          <span>Arrival Confirmed</span>
          <span class="order-tab-count" id="countArrivalConfirmed">0</span>
        </button>
        <button type="button" onclick="setFilter('cancelled')" class="order-tab-btn" data-status="cancelled">
          <i data-lucide="x-circle" class="w-3 h-3 text-rose-500"></i>
          <span>Cancelled</span>
          <span class="order-tab-count" id="countCancelled">0</span>
        </button>
      </div>
    </div>

    <!-- Orders Feed Container -->
    <div id="ordersFeed" class="space-y-4">
      <div class="py-16 text-center text-slate-400 bg-white rounded-2xl border border-slate-200/80">
        Loading your wholesale orders...
      </div>
    </div>

  </main>

  <div data-site-footer></div>

  <script src="assets/js/layout.js?v=7"></script>
  <script src="assets/js/api.js"></script>
  <script>
    let allOrders = [];
    let activeFilter = 'all';
    const orderDateOptions = { month: 'short', day: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' };

    const formatPeso = value => '₱' + Number(value || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const getOrderDate = order => {
      const date = new Date(String(order.createdAt || '').replace(' ', 'T'));
      return Number.isNaN(date.getTime()) ? null : date;
    };

    const escapeHtml = value => String(value ?? '').replace(/[&<>'"]/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
    }[c]));

    const safeImageUrl = value => {
      const url = String(value ?? '').trim();
      if (!url) return '';
      if (/^(https:\/\/|\/|assets\/|uploads\/products\/)/i.test(url)) return url;
      return '';
    };

    function setFilter(status) {
      activeFilter = status;
      document.querySelectorAll('.order-tab-btn').forEach(btn => {
        btn.classList.toggle('order-tab-btn--active', btn.dataset.status === status);
      });
      renderOrders();
    }

    async function loadOrders() {
      const feed = document.getElementById('ordersFeed');
      try {
        allOrders = await API.get('api/orders.php');
        if (!Array.isArray(allOrders)) allOrders = [];

        populateOrderYears();
        updateCounts();
        renderOrders();
      } catch (err) {
        feed.innerHTML = `<div class="p-6 rounded-2xl bg-red-50 text-red-600 border border-red-200 text-center text-sm font-medium">${escapeHtml(err.message || 'Unable to load orders.')}</div>`;
      }
    }

    function populateOrderYears() {
      const yearFilter = document.getElementById('orderYearFilter');
      if (!yearFilter) return;
      const selectedYear = yearFilter.value;
      const years = [...new Set(allOrders.map(getOrderDate).filter(Boolean).map(date => date.getFullYear()))]
        .sort((a, b) => b - a);
      yearFilter.innerHTML = '<option value="">All years</option>' + years
        .map(year => `<option value="${year}">${year}</option>`).join('');
      yearFilter.value = years.includes(Number(selectedYear)) ? selectedYear : '';
    }

    function updateCounts() {
      const counts = { all: allOrders.length, pending: 0, confirmed: 0, processing: 0, ready_for_dispatch: 0, shipped: 0, delivered: 0, arrival_confirmed: 0, cancelled: 0 };
      allOrders.forEach(o => {
        const s = o.status;
        if (counts[s] !== undefined) counts[s]++;
      });

      document.getElementById('countAll').textContent = counts.all;
      document.getElementById('countPending').textContent = counts.pending;
      document.getElementById('countConfirmed').textContent = counts.confirmed;
      document.getElementById('countProcessing').textContent = counts.processing;
      document.getElementById('countReadyForDispatch').textContent = counts.ready_for_dispatch;
      document.getElementById('countShipped').textContent = counts.shipped;
      document.getElementById('countDelivered').textContent = counts.delivered;
      document.getElementById('countArrivalConfirmed').textContent = counts.arrival_confirmed;
      document.getElementById('countCancelled').textContent = counts.cancelled;
    }

    function renderOrders() {
      const feed = document.getElementById('ordersFeed');
      const q = document.getElementById('orderSearchInput')?.value.toLowerCase().trim() || '';

      const year = document.getElementById('orderYearFilter')?.value || '';
      const month = document.getElementById('orderMonthFilter')?.value || '';
      const day = document.getElementById('orderDayFilter')?.value || '';
      const sortOrder = document.getElementById('orderSortSelect')?.value || 'date-desc';
      const filtered = allOrders.filter(o => {
        const matchesStatus = activeFilter === 'all' || o.status === activeFilter;
        const matchesQuery = !q 
          || String(o.supplierOrderNumber).includes(q)
          || (o.supplierBusinessName && o.supplierBusinessName.toLowerCase().includes(q))
          || (o.supplierName && o.supplierName.toLowerCase().includes(q))
          || (o.supplierUsername && o.supplierUsername.toLowerCase().includes(q))
          || (o.items && o.items.some(it => it.name.toLowerCase().includes(q)));
        const orderDate = getOrderDate(o);
        const matchesYear = !year || orderDate?.getFullYear() === Number(year);
        const matchesMonth = !month || orderDate?.getMonth() + 1 === Number(month);
        const matchesDay = !day || orderDate?.getDate() === Number(day);
        return matchesStatus && matchesQuery && matchesYear && matchesMonth && matchesDay;
      });
      const supplierName = order => String(order.supplierBusinessName || order.supplierName || '');
      const collator = new Intl.Collator(undefined, { sensitivity: 'base', numeric: true });
      filtered.sort((a, b) => {
        if (sortOrder === 'supplier-name-asc') return collator.compare(supplierName(a), supplierName(b));
        if (sortOrder === 'supplier-name-desc') return collator.compare(supplierName(b), supplierName(a));
        if (sortOrder === 'supplier-username-asc') return collator.compare(a.supplierUsername || '', b.supplierUsername || '');
        if (sortOrder === 'supplier-username-desc') return collator.compare(b.supplierUsername || '', a.supplierUsername || '');
        const dateA = getOrderDate(a)?.getTime() ?? 0;
        const dateB = getOrderDate(b)?.getTime() ?? 0;
        return sortOrder === 'date-asc' ? dateA - dateB : dateB - dateA;
      });

      if (!filtered.length) {
        feed.innerHTML = `
          <div class="py-16 text-center bg-white rounded-2xl border border-slate-200/80 p-8">
            <div class="w-16 h-16 rounded-2xl bg-slate-100 text-slate-400 flex items-center justify-center mx-auto mb-3">
              <i data-lucide="package-open" class="w-8 h-8"></i>
            </div>
            <h3 class="font-bold text-slate-800 text-base">No orders found</h3>
            <p class="text-xs text-slate-500 mt-1 max-w-sm mx-auto">
              ${q || year || month || day ? 'No orders match your search or date filters. Try changing your criteria.' : 'You haven’t placed any orders in this category yet.'}
            </p>
            <a href="marketplace.html" class="inline-flex items-center gap-1.5 mt-4 px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-bold shadow-sm transition">
              <i data-lucide="store" class="w-3.5 h-3.5"></i>
              <span>Explore Supplies Catalog</span>
            </a>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      feed.innerHTML = filtered.map(order => {
        const isDelivered = order.status === 'delivered';
        const isArrivalConfirmed = order.status === 'arrival_confirmed';
        const isConfirmed = ['confirmed', 'processing', 'ready_for_dispatch', 'shipped', 'delivered', 'arrival_confirmed'].includes(order.status);
        const isCancelled = order.status === 'cancelled';
        const isPending = order.status === 'pending';

        const statusBadges = {
          delivered: { cls: 'bg-teal-50 text-teal-700 border-teal-200', icon: 'package-check', text: 'Delivered - Confirm arrival' },
          arrival_confirmed: { cls: 'bg-emerald-50 text-emerald-700 border-emerald-200', icon: 'check-circle-2', text: 'Arrival Confirmed' },
          shipped: { cls: 'bg-indigo-50 text-indigo-700 border-indigo-200', icon: 'truck', text: 'Shipped' },
          ready_for_dispatch: { cls: 'bg-cyan-50 text-cyan-700 border-cyan-200', icon: 'package-check', text: 'Ready for Dispatch' },
          processing: { cls: 'bg-violet-50 text-violet-700 border-violet-200', icon: 'loader-circle', text: 'Processing' },
          confirmed: { cls: 'bg-blue-50 text-blue-700 border-blue-200', icon: 'truck', text: 'Confirmed' },
          cancelled: { cls: 'bg-rose-50 text-rose-700 border-rose-200', icon: 'x-circle', text: 'Cancelled' },
          pending: { cls: 'bg-amber-50 text-amber-700 border-amber-200', icon: 'clock', text: 'Pending Supplier Approval' }
        };
        const badge = statusBadges[order.status] || statusBadges.pending;

        return `
          <article class="bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden transition hover:border-slate-300">
            <!-- Order Card Header -->
            <div class="p-5 border-b border-slate-100 flex flex-col sm:flex-row sm:items-center justify-between gap-3 bg-slate-50/50">
              <div>
                <div class="flex items-center gap-2">
                  <span class="text-xs font-black text-blue-600 bg-blue-50 px-2 py-0.5 rounded-md border border-blue-100">
                    Receipt #${escapeHtml(order.supplierOrderNumber)}
                  </span>
                  <span class="text-xs text-slate-400 font-medium">Placed on ${getOrderDate(order)?.toLocaleString('en-US', orderDateOptions) || 'Date unavailable'}</span>
                </div>
                <h2 class="text-base font-black text-slate-900 mt-1 flex items-center gap-1.5">
                  <i data-lucide="store" class="w-4 h-4 text-slate-400"></i>
                  <span>${escapeHtml(order.supplierBusinessName || order.supplierName || 'Verified Supplier')}</span>
                </h2>
                ${order.supplierUsername ? `<p class="text-xs text-slate-400 mt-0.5">Username: @${escapeHtml(order.supplierUsername)}</p>` : ''}
              </div>

              <div class="flex items-center gap-3">
                ${isDelivered ? `
                  <button type="button" onclick="confirmOrderArrival(${order.id}, '${escapeHtml(order.supplierOrderNumber)}')"
                    class="px-3.5 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-black shadow-sm flex items-center gap-1.5 transition">
                    <i data-lucide="check-circle" class="w-4 h-4"></i>
                    <span>Confirm Arrival</span>
                  </button>
                ` : ''}
                ${isArrivalConfirmed ? `<span class="text-xs font-bold text-emerald-700">Confirmed ${escapeHtml(order.arrivalConfirmedAt ? new Date(String(order.arrivalConfirmedAt).replace(' ', 'T')).toLocaleString() : '')}</span>` : ''}
                <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-xl text-xs font-bold border ${badge.cls}">
                  <i data-lucide="${badge.icon}" class="w-3.5 h-3.5"></i>
                  <span>${badge.text}</span>
                </span>
              </div>
            </div>

            <!-- Visual Progress Stepper (if not cancelled) -->
            ${!isCancelled ? `
              <div class="px-6 pt-5 pb-2">
                <div class="flex items-center max-w-md mx-auto relative">
                  <!-- Step 1: Placed -->
                  <div class="stepper-step">
                    <div class="stepper-circle stepper-circle--done">
                      <i data-lucide="check" class="w-3.5 h-3.5"></i>
                    </div>
                    <span class="text-[11px] font-bold text-slate-800 mt-1">Order Placed</span>
                    <span class="text-[9px] text-slate-400">${getOrderDate(order)?.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) || '—'}</span>
                    <div class="stepper-line ${isConfirmed ? 'stepper-line--done' : ''}"></div>
                  </div>

                  <!-- Step 2: Confirmed -->
                  <div class="stepper-step">
                    <div class="stepper-circle ${isConfirmed ? 'stepper-circle--done' : isPending ? 'stepper-circle--active' : 'stepper-circle--pending'}">
                      ${isConfirmed ? '<i data-lucide="check" class="w-3.5 h-3.5"></i>' : '2'}
                    </div>
                    <span class="text-[11px] font-bold ${isConfirmed ? 'text-slate-800' : 'text-slate-400'} mt-1">Processing</span>
                    <span class="text-[9px] text-slate-400">${isConfirmed ? 'Supplier accepted' : 'In Review'}</span>
                    <div class="stepper-line ${isDelivered ? 'stepper-line--done' : ''}"></div>
                  </div>

                  <!-- Step 3: Delivered -->
                  <div class="stepper-step">
                    <div class="stepper-circle ${isDelivered || isArrivalConfirmed ? 'stepper-circle--done' : 'stepper-circle--pending'}">
                      ${isDelivered || isArrivalConfirmed ? '<i data-lucide="check" class="w-3.5 h-3.5"></i>' : '3'}
                    </div>
                    <span class="text-[11px] font-bold ${isDelivered || isArrivalConfirmed ? 'text-emerald-700' : 'text-slate-400'} mt-1">Supplier Delivered</span>
                    <span class="text-[9px] text-slate-400">${isDelivered || isArrivalConfirmed ? 'Ready for receipt' : 'Pending Delivery'}</span>
                  </div>
                </div>
              </div>
            ` : ''}

            <!-- Order Items & Details -->
            <div class="p-5 grid grid-cols-1 md:grid-cols-3 gap-6 text-xs">
              <!-- Column 1: Items Purchased -->
              <div class="md:col-span-2 space-y-3">
                <p class="text-[11px] font-bold uppercase tracking-wider text-slate-400">Purchased Supplies</p>
                <div class="space-y-2">
                  ${(order.items || []).map(item => `
                    <div class="flex items-center justify-between p-3 rounded-xl bg-slate-50 border border-slate-100">
                      <div class="flex items-center gap-3">
                        <div class="w-11 h-11 rounded-lg bg-white overflow-hidden flex items-center justify-center shrink-0 border border-slate-200">
                          ${safeImageUrl(item.imageUrl) 
                            ? `<img src="${escapeHtml(safeImageUrl(item.imageUrl))}" alt="${escapeHtml(item.name)}" class="w-full h-full object-cover">` 
                            : `<i data-lucide="package" class="w-5 h-5 text-slate-300"></i>`}
                        </div>
                        <div>
                          <div class="font-bold text-slate-900 text-sm">${escapeHtml(item.name)}</div>
                          <div class="text-slate-400 text-[11px]">Unit Price: ${formatPeso(item.priceAtOrder)}/${escapeHtml(item.unit || 'unit')}</div>
                        </div>
                      </div>

                      <div class="text-right">
                        <span class="font-black text-slate-900 text-sm">Qty: ${Number(item.quantity)} ${escapeHtml(item.unit || 'unit')}</span>
                        <div class="text-blue-600 font-bold text-[11px]">${formatPeso(Number(item.quantity) * Number(item.priceAtOrder))}</div>
                      </div>
                    </div>
                  `).join('')}
                </div>

                <!-- Delivery Address & Notes -->
                <div class="p-3.5 rounded-xl bg-slate-50 border border-slate-100 text-slate-600 space-y-1 mt-3">
                  <div class="flex items-start gap-2">
                    <i data-lucide="map-pin" class="w-4 h-4 text-slate-400 shrink-0 mt-0.5"></i>
                    <div>
                      <span class="font-bold text-slate-800">Delivery Address:</span>
                      <span>${escapeHtml(order.deliveryAddress || 'Standard Delivery Location')}</span>
                    </div>
                  </div>
                  ${order.deliveryNotes ? `
                    <div class="flex items-start gap-2 pt-1">
                      <i data-lucide="info" class="w-4 h-4 text-slate-400 shrink-0 mt-0.5"></i>
                      <div>
                        <span class="font-bold text-slate-800">Special Notes:</span>
                        <span>${escapeHtml(order.deliveryNotes)}</span>
                      </div>
                    </div>
                  ` : ''}
                </div>
              </div>

              <!-- Column 2: Payment & Financial Summary -->
              <div class="flex flex-col justify-between border-t md:border-t-0 md:border-l border-slate-100 md:pl-6 pt-4 md:pt-0 space-y-4">
                <div>
                  <p class="text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-2">Payment Summary</p>
                  
                  <div class="p-3 rounded-xl bg-slate-50 border border-slate-100 space-y-2">
                    <div class="flex justify-between text-slate-500">
                      <span>Payment Method</span>
                      <span class="font-bold text-slate-800">${escapeHtml(order.paymentMethod || 'COD')}</span>
                    </div>
                    <div class="flex justify-between items-baseline pt-2 border-t border-slate-200/60">
                      <span class="font-bold text-slate-800">Grand Total</span>
                      <span class="text-lg font-black text-blue-600">${formatPeso(order.totalAmount)}</span>
                    </div>
                  </div>
                </div>

                <!-- Action Buttons -->
                <div class="space-y-2">
                  ${isDelivered ? `
                    <button type="button" onclick="confirmOrderArrival(${order.id}, '${escapeHtml(order.supplierOrderNumber)}')" 
                      class="w-full py-2.5 px-3 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-black text-xs flex items-center justify-center gap-1.5 shadow-md shadow-emerald-600/20 transition">
                      <i data-lucide="check-circle" class="w-4 h-4"></i>
                      <span>Confirm Product Arrival</span>
                    </button>
                  ` : isArrivalConfirmed ? `
                    <div class="w-full py-2.5 px-3 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-800 font-bold text-xs flex items-center justify-center gap-1.5">
                      <i data-lucide="check-check" class="w-4 h-4 text-emerald-600"></i>
                      <span>Arrival Confirmed${order.arrivalConfirmedAt ? ` · ${escapeHtml(new Date(String(order.arrivalConfirmedAt).replace(' ', 'T')).toLocaleString())}` : ''}</span>
                    </div>
                  ` : ''}

                  <button type="button" onclick="printReceipt(${escapeHtml(JSON.stringify(order))})" 
                    class="w-full py-2.5 px-3 rounded-xl border border-slate-200 hover:bg-slate-50 text-slate-700 font-bold text-xs flex items-center justify-center gap-1.5 transition">
                    <i data-lucide="printer" class="w-3.5 h-3.5"></i>
                    <span>Print Order Slip</span>
                  </button>

                  <a href="vendor.html#marketplace"
                    class="w-full py-2.5 px-3 rounded-xl bg-blue-50 hover:bg-blue-100 text-blue-700 font-bold text-xs flex items-center justify-center gap-1.5 transition">
                    <i data-lucide="repeat" class="w-3.5 h-3.5"></i>
                    <span>Order Supplies Again</span>
                  </a>
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');

      lucide.createIcons();
    }

    async function confirmOrderArrival(orderId, orderNumber) {
      const isConfirmed = confirm(`Confirm that Wholesale Order #${orderNumber} has arrived?\n\nThis will notify the supplier.`);
      if (!isConfirmed) return;

      try {
        const res = await API.put('api/orders.php', {
          orderId: Number(orderId),
          status: 'arrival_confirmed'
        });

        if (res && res.success) {
          const order = allOrders.find(o => Number(o.id) === Number(orderId));
          if (order) {
            order.status = 'arrival_confirmed';
            order.arrivalConfirmedAt = new Date().toISOString();
          }
          updateCounts();
          renderOrders();

          // Success notification toast
          const toast = document.createElement('div');
          toast.className = 'fixed bottom-5 right-5 z-[60] w-[min(24rem,calc(100vw-2rem))] rounded-2xl bg-emerald-600 text-white p-4 shadow-2xl border border-emerald-500 flex items-start gap-3';
          toast.innerHTML = `
            <div class="w-8 h-8 rounded-xl bg-white/20 flex items-center justify-center shrink-0">
              <i data-lucide="check-circle-2" class="w-5 h-5 text-white"></i>
            </div>
            <div class="flex-1 min-w-0">
              <p class="font-bold text-sm">Arrival Confirmed!</p>
              <p class="text-xs text-emerald-100 mt-0.5">Order Receipt #${escapeHtml(orderNumber)} has been marked as received.</p>
            </div>
          `;
          document.body.appendChild(toast);
          lucide.createIcons();
          setTimeout(() => toast.remove(), 4000);
        }
      } catch (err) {
        alert(err.message || 'Unable to update order status.');
      }
    }

    // Print Receipt Helper
    function printReceipt(order) {
      const printWindow = window.open('', '_blank', 'width=650,height=700');
      if (!printWindow) {
        alert('Please allow popups to print the order slip.');
        return;
      }

      const itemsHtml = (order.items || []).map(i => `
        <tr>
          <td class="receipt-cell">${escapeHtml(i.name)}</td>
          <td class="receipt-cell receipt-align-center">${Number(i.quantity)}</td>
          <td class="receipt-cell receipt-align-right">${formatPeso(i.priceAtOrder)}</td>
          <td class="receipt-cell receipt-align-right receipt-emphasis">${formatPeso(Number(i.quantity) * Number(i.priceAtOrder))}</td>
        </tr>
      `).join('');

      printWindow.document.write(`
        <!DOCTYPE html>
        <html>
        <head>
          <title>Order Receipt #${escapeHtml(order.supplierOrderNumber)}</title>
          <link rel="stylesheet" href="assets/css/style.css">
        </head>
        <body>
          <div class="header">
            <h1 class="receipt-title">VendLink Wholesale Order Slip</h1>
            <p class="receipt-subtitle">Receipt #${escapeHtml(order.supplierOrderNumber)} · ${new Date(order.createdAt).toLocaleString()}</p>
          </div>

          <div class="receipt-details">
            <strong>Supplier:</strong> ${escapeHtml(order.supplierBusinessName || order.supplierName || 'Verified Supplier')}<br>
            <strong>Status:</strong> <span class="badge">${escapeHtml(order.status).toUpperCase()}</span><br>
            <strong>Payment Method:</strong> ${escapeHtml(order.paymentMethod || 'Cash on Delivery')}<br>
            <strong>Delivery Address:</strong> ${escapeHtml(order.deliveryAddress || 'Standard Delivery')}
          </div>

          <table>
            <thead>
              <tr>
                <th>Item</th>
                <th class="receipt-align-center">Qty</th>
                <th class="receipt-align-right">Unit Price</th>
                <th class="receipt-align-right">Subtotal</th>
              </tr>
            </thead>
            <tbody>
              ${itemsHtml}
            </tbody>
          </table>

          <div class="total-row">
            Grand Total: ${formatPeso(order.totalAmount)}
          </div>

          <p class="receipt-note">
            Thank you for ordering via VendLink. Retain this slip for your delivery handover.
          </p>

          <script>
            window.onload = function() { window.print(); }
          <\/script>
        </body>
        </html>
      `);
      printWindow.document.close();
    }

    document.getElementById('orderSearchInput')?.addEventListener('input', renderOrders);
    ['orderYearFilter', 'orderMonthFilter', 'orderDayFilter', 'orderSortSelect'].forEach(id => {
      document.getElementById(id)?.addEventListener('change', renderOrders);
    });
    document.addEventListener('DOMContentLoaded', loadOrders);
  </script>
</body>
</html>
